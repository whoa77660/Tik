<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SMM Panel</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:linear-gradient(135deg,#0a0a1a,#1a1a3a);
            font-family:'Segoe UI',Arial,sans-serif;
            min-height:100vh;display:flex;align-items:center;justify-content:center;
            color:#fff;padding:20px
        }
        .reg-box{
            background:rgba(20,20,40,.95);border-radius:16px;
            padding:35px 30px;width:100%;max-width:420px;
            border:1px solid rgba(255,255,255,.1);
            box-shadow:0 20px 40px rgba(0,0,0,.5)
        }
        h2{
            text-align:center;font-size:1.6rem;margin-bottom:5px;
            background:linear-gradient(135deg,#00d4ff,#b0b0ff);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent
        }
        .sub{text-align:center;color:#888;font-size:.85rem;margin-bottom:20px}
        label{display:block;font-size:.85rem;color:#aaa;margin:12px 0 4px}
        input{
            width:100%;padding:12px 15px;border-radius:10px;margin:4px 0;
            border:1px solid rgba(255,255,255,.15);
            background:rgba(0,0,0,.3);color:#fff;font-size:.95rem;
            transition:all .2s
        }
        input:focus{outline:none;border-color:#00d4ff;box-shadow:0 0 15px rgba(0,212,255,.2)}
        button{
            width:100%;padding:13px;border-radius:10px;margin-top:20px;
            background:linear-gradient(135deg,#00b894,#00cec9);
            color:#fff;font-weight:700;font-size:1rem;border:none;cursor:pointer;
            transition:all .2s
        }
        button:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(0,184,148,.4)}
        .error{
            background:rgba(255,71,87,.15);color:#ff4757;
            padding:10px;border-radius:8px;text-align:center;
            margin:10px 0;display:none;font-size:.9rem
        }
        p{text-align:center;margin-top:18px;font-size:.9rem;color:#888}
        a{color:#aaccff;text-decoration:none} a:hover{color:#fff}
        .hint{font-size:.75rem;color:#666;margin-top:2px}
    </style>
</head>
<body>
    <div class="reg-box">
        <h2>Create Account</h2>
        <p class="sub">Register to access SMM Panel</p>
        <div class="error" id="err"></div>
        <form onsubmit="doRegister(event)">
            <label>Username</label>
            <input type="text" name="username" placeholder="Choose username" required autocomplete="username">
            
            <label>Password</label>
            <input type="password" name="password" placeholder="Create password" required autocomplete="new-password">
            
            <label>SMM API Key</label>
            <input type="text" name="api_key" placeholder="Your SMM API key" required autocomplete="off">
            <div class="hint">Get API key from your SMM provider</div>
            
            <label>Admin Secret Key</label>
            <input type="text" name="admin_secret" placeholder="Admin secret key" required autocomplete="off">
            <div class="hint">Required for registration</div>
            
            <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="/login">Login</a></p>
    </div>
    <script>
        async function doRegister(e){
            e.preventDefault();
            const f=new FormData(e.target);
            const d=Object.fromEntries(f);
            const r=await fetch('/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
            const j=await r.json();
            if(j.success){ alert(j.message||'Registration successful!'); window.location.href='/login'; }
            else{ document.getElementById('err').style.display='block'; document.getElementById('err').innerText=j.error; }
        }
    </script>
</body>
</html>
