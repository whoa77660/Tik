<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Explorer</title>

    <!-- ════════════ STYLES ════════════ -->
    <style>
        /* ── Reset & Base ─────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg:        #0a0e1a;
            --surface:   rgba(255, 255, 255, 0.05);
            --border:    rgba(255, 255, 255, 0.08);
            --border-hi: rgba(255, 255, 255, 0.15);
            --text:      #e2e8f0;
            --muted:     #64748b;
            --accent:    #6366f1;
            --accent2:   #818cf8;
            --blue:      #3b82f6;
            --green:     #10b981;
            --red:       #ef4444;
            --radius:    12px;
            --shadow:    0 8px 32px rgba(0, 0, 0, 0.4);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* ── Scrollbar ───────────────────────────── */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        /* ── Glass card ──────────────────────────── */
        .glass {
            background: var(--surface);
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius);
        }

        /* ── Hero / Search ───────────────────────── */
        #hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(99, 102, 241, 0.12) 0%, transparent 70%);
        }

        #hero h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 1rem;
            text-align: center;
        }

        #hero h1 span {
            color: var(--accent2);
        }

        #hero p {
            color: var(--muted);
            font-size: 1.1rem;
            text-align: center;
            max-width: 520px;
            margin-bottom: 2.5rem;
            font-family: 'Courier New', monospace;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            background: rgba(99, 102, 241, .12);
            border: 1px solid rgba(99, 102, 241, .3);
            color: var(--accent2);
            font-size: .75rem;
            font-weight: 600;
            letter-spacing: .05em;
            text-transform: uppercase;
            padding: .3rem .8rem;
            border-radius: 999px;
            margin-bottom: 1.5rem;
        }

        /* ── Search form ─────────────────────────── */
        #search-form {
            display: flex;
            gap: 0;
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--radius);
            overflow: hidden;
            transition: border-color .2s;
        }

        #search-form:focus-within {
            border-color: rgba(99, 102, 241, .6);
        }

        #search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 1rem 1.2rem;
            color: var(--text);
            font-size: 1rem;
        }

        #search-input::placeholder {
            color: var(--muted);
        }

        #count-select {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text);
            padding: 0 .75rem;
            font-size: .875rem;
            outline: none;
            width: 90px;
            text-align: center;
        }

        #count-select::-webkit-inner-spin-button,
        #count-select::-webkit-outer-spin-button {
            opacity: .5;
        }

        #count-select::placeholder {
            color: var(--muted);
        }

        #search-btn {
            background: var(--accent);
            border: none;
            color: #fff;
            font-size: .95rem;
            font-weight: 600;
            padding: 0 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: .5rem;
            transition: background .2s;
            white-space: nowrap;
        }

        #search-btn:hover {
            background: #4f52d8;
        }

        #search-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* ── Search form mobile fix ──────────────── */
        @media (max-width: 600px) {
            #search-form {
                flex-direction: column;
                overflow: visible;
                background: transparent;
                border: none;
                gap: .5rem;
            }

            #search-input {
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: var(--radius);
                padding: .9rem 1.1rem;
                font-size: .95rem;
                transition: border-color .2s;
            }

            #search-form:focus-within #search-input {
                border-color: rgba(99, 102, 241, .6);
            }

            #count-select {
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.12) !important;
                border-radius: var(--radius);
                padding: .75rem 1rem;
                width: 100%;
                font-size: .875rem;
            }

            #search-btn {
                border-radius: var(--radius);
                padding: .85rem 1.5rem;
                justify-content: center;
                font-size: 1rem;
            }
        }

        /* ── Search History Dropdown ──────────────── */
        .search-history-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 50;
            background: rgba(20, 24, 44, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 0 0 var(--radius) var(--radius);
            margin-top: 4px;
            max-height: 280px;
            overflow-y: auto;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6);
        }

        .search-history-dropdown.hidden {
            display: none;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: .65rem 1rem;
            font-size: .9rem;
            cursor: pointer;
            transition: background .15s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .history-item-username {
            flex: 1;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item-delete {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            padding: 0 0 0 .75rem;
            transition: color .15s;
        }

        .history-item-delete:hover {
            color: #fca5a5;
        }

        .history-clear {
            text-align: center;
            padding: .55rem 1rem;
            font-size: .8rem;
            color: var(--muted);
            cursor: pointer;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            transition: color .15s;
        }

        .history-clear:hover {
            color: var(--text);
        }

        /* ── Mini search wrap (for history dropdown) */
        .mini-search-wrap {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .mini-search-wrap .search-history-dropdown {
            top: calc(100% + 4px);
            border-radius: var(--radius);
        }

        /* ── Error banner ─────────────────────────── */
        .error-banner {
            background: rgba(239, 68, 68, .1);
            border: 1px solid rgba(239, 68, 68, .3);
            border-radius: var(--radius);
            padding: 1rem 1.5rem;
            color: #fca5a5;
            text-align: center;
            max-width: 600px;
            margin: 1rem auto;
        }

        .error-banner button {
            background: rgba(239, 68, 68, .2);
            border: 1px solid rgba(239, 68, 68, .4);
            color: #fca5a5;
            padding: .4rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: .6rem;
            font-size: .875rem;
        }

        /* ── Dashboard ────────────────────────────── */
        #dashboard {
            display: none;
            padding: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ── Navbar ───────────────────────────────── */
        #topbar {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        #topbar .brand {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        #topbar .brand span {
            color: var(--accent2);
        }

        #mini-search {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: .5rem .9rem;
            color: var(--text);
            font-size: .875rem;
            outline: none;
        }

        #mini-search:focus {
            border-color: rgba(99, 102, 241, .5);
        }

        #back-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: .5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: .875rem;
            transition: all .2s;
        }

        #back-btn:hover {
            border-color: var(--border-hi);
            color: var(--text);
        }

        /* ── Profile header ──────────────────────── */
        #profile-header {
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1.5rem;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        #profile-header img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-hi);
            flex-shrink: 0;
        }

        .profile-info {
            flex: 1;
            min-width: 200px;
        }

        .profile-name {
            display: flex;
            align-items: center;
            gap: .5rem;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: .2rem;
        }

        .verified-badge {
            background: var(--blue);
            color: #fff;
            font-size: .6rem;
            padding: .2rem .4rem;
            border-radius: 4px;
            font-weight: 700;
            letter-spacing: .05em;
        }

        .profile-handle {
            color: var(--muted);
            font-size: .9rem;
            margin-bottom: .6rem;
        }

        .profile-bio {
            font-size: .875rem;
            color: #94a3b8;
            max-width: 500px;
            margin-bottom: .8rem;
        }

        .profile-stats {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-num {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .stat-label {
            font-size: .7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        .profile-actions {
            display: flex;
            gap: .5rem;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding: .5rem 1rem;
            border-radius: 8px;
            font-size: .8rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all .15s;
            text-decoration: none;
        }

        .btn-ghost {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-ghost:hover {
            border-color: var(--border-hi);
            background: rgba(255, 255, 255, .08);
        }

        .btn-accent {
            background: var(--accent);
            color: #fff;
        }

        .btn-accent:hover {
            background: #4f52d8;
        }

        .btn-green {
            background: rgba(16, 185, 129, .15);
            border: 1px solid rgba(16, 185, 129, .3);
            color: #6ee7b7;
        }

        .btn-green:hover {
            background: rgba(16, 185, 129, .25);
        }

        /* ── Controls bar ────────────────────────── */
        #controls {
            display: flex;
            gap: .75rem;
            align-items: center;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
        }

        #filter-input {
            flex: 1;
            min-width: 180px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: .55rem 1rem;
            color: var(--text);
            font-size: .875rem;
            outline: none;
        }

        #filter-input:focus {
            border-color: rgba(99, 102, 241, .5);
        }

        #sort-select {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: .55rem .9rem;
            color: var(--text);
            font-size: .875rem;
            outline: none;
            cursor: pointer;
        }

        #sort-select option {
            background: #1e2235;
        }

        .count-badge {
            display: inline-flex;
            align-items: center;
            gap: .35rem;
            font-size: .8rem;
            font-weight: 700;
            white-space: nowrap;
            color: #fff;
            background: rgba(99, 102, 241, .18);
            border: 1px solid rgba(99, 102, 241, .35);
            padding: .3rem .75rem;
            border-radius: 999px;
            letter-spacing: .01em;
        }

        /* ── Bulk actions ────────────────────────── */
        #bulk-bar {
            display: none;
            align-items: center;
            gap: .75rem;
            padding: .75rem 1rem;
            margin-bottom: 1rem;
            background: rgba(99, 102, 241, .08);
            border: 1px solid rgba(99, 102, 241, .2);
            border-radius: 10px;
            flex-wrap: wrap;
        }

        #bulk-bar.visible {
            display: flex;
        }

        #bulk-count {
            font-size: .875rem;
            color: var(--accent2);
            font-weight: 600;
        }

        /* ── Selected Statistics Panel ────────────── */
        #selected-stats {
            display: none;
            padding: 1rem 1.25rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        #selected-stats.visible {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        .stats-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            flex: 1;
            min-width: 0;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            gap: .15rem;
        }

        .stat-box-label {
            font-size: .65rem;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: var(--muted);
        }

        .stat-box-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            font-family: monospace;
        }

        .stats-expand-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: .4rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: .8rem;
            transition: all .15s;
            white-space: nowrap;
        }

        .stats-expand-btn:hover {
            border-color: var(--border-hi);
            color: var(--text);
        }

        #stats-extra {
            width: 100%;
            display: none;
            margin-top: .75rem;
            gap: 1.2rem;
            flex-wrap: wrap;
            border-top: 1px solid var(--border);
            padding-top: .75rem;
        }

        #stats-extra.visible {
            display: flex;
        }

        .stats-extra-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: .75rem;
            width: 100%;
        }

        .extra-stat-row {
            display: flex;
            justify-content: space-between;
            gap: .5rem;
            font-size: .8rem;
            padding: .4rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .extra-stat-label {
            color: var(--muted);
        }

        .extra-stat-value {
            font-weight: 600;
            font-family: monospace;
        }

        /* ── Video grid ──────────────────────────── */
        #video-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        @media (max-width: 1100px) {
            #video-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 760px) {
            #video-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: .6rem;
            }
        }

        @media (max-width: 400px) {
            #video-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: .5rem;
            }
        }

        /* ── Video card ──────────────────────────── */
        .video-card {
            border-radius: var(--radius);
            overflow: hidden;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            transition: transform .2s, border-color .2s, box-shadow .2s;
            cursor: pointer;
            position: relative;
        }

        .video-card:hover {
            transform: translateY(-3px);
            border-color: rgba(99, 102, 241, .4);
            box-shadow: 0 12px 40px rgba(99, 102, 241, .15);
        }

        .video-card.selected {
            border-color: var(--accent);
            background: rgba(99, 102, 241, .08);
        }

        .video-card.submitted {
            border-color: rgba(16, 185, 129, .35);
        }

        .thumb-wrap {
            position: relative;
            aspect-ratio: 9/16;
            background: #0f1424;
            overflow: hidden;
        }

        .thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .3s;
        }

        .video-card:hover .thumb-wrap img {
            transform: scale(1.04);
        }

        .thumb-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--muted);
        }

        .duration-badge {
            position: absolute;
            bottom: .4rem;
            right: .4rem;
            background: rgba(0, 0, 0, .75);
            color: #fff;
            font-size: .7rem;
            font-weight: 600;
            padding: .15rem .45rem;
            border-radius: 4px;
        }

        .submitted-icon {
            position: absolute;
            top: .4rem;
            right: .4rem;
            background: rgba(16,185,129,.15);
            border: 1px solid rgba(16,185,129,.35);
            color: #6ee7b7;
            font-size: .65rem;
            font-weight: 700;
            padding: .1rem .4rem;
            border-radius: 4px;
            z-index: 3;
            letter-spacing: .02em;
        }

        .select-checkbox {
            position: absolute;
            top: .5rem;
            left: .5rem;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            border: 2px solid rgba(255, 255, 255, .5);
            background: rgba(0, 0, 0, .4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2;
            transition: all .15s;
        }

        .video-card.selected .select-checkbox,
        .select-checkbox:hover {
            border-color: var(--accent);
            background: var(--accent);
        }

        .select-checkbox svg {
            display: none;
        }

        .video-card.selected .select-checkbox svg {
            display: block;
        }

        .card-body {
            padding: .75rem;
            cursor: default;
        }

        .card-desc {
            font-size: .78rem;
            color: var(--text);
            margin-bottom: .5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: .3rem;
            margin-bottom: .5rem;
        }

        .tag {
            font-size: .65rem;
            color: var(--accent2);
            background: rgba(99, 102, 241, .1);
            border: 1px solid rgba(99, 102, 241, .2);
            padding: .1rem .4rem;
            border-radius: 999px;
        }

        .card-stats {
            display: flex;
            gap: .75rem;
            flex-wrap: wrap;
            margin-bottom: .6rem;
        }

        .card-stat {
            font-size: .7rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: .25rem;
        }

        .card-stat svg {
            opacity: .7;
        }

        .card-date {
            font-size: .65rem;
            color: #475569;
            margin-bottom: .6rem;
        }

        .card-actions {
            display: flex;
            gap: .4rem;
            flex-wrap: wrap;
        }

        .card-btn {
            flex: 1;
            background: rgba(255, 255, 255, .05);
            border: 1px solid var(--border);
            color: var(--muted);
            padding: .35rem .5rem;
            border-radius: 6px;
            font-size: .65rem;
            cursor: pointer;
            text-align: center;
            transition: all .15s;
            white-space: nowrap;
        }

        .card-btn:hover {
            border-color: var(--border-hi);
            color: var(--text);
        }

        .card-btn a {
            color: inherit;
            text-decoration: none;
        }

        /* ── Skeleton loader ─────────────────────── */
        .skeleton {
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: -400px 0;
            }
            100% {
                background-position: 400px 0;
            }
        }

        .skel-card {
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .skel-thumb {
            aspect-ratio: 9/16;
            background: linear-gradient(90deg, #1a1f35 25%, #222840 50%, #1a1f35 75%);
            background-size: 400px 100%;
            animation: shimmer 1.5s infinite;
        }

        .skel-body {
            padding: .75rem;
        }

        .skel-line {
            border-radius: 4px;
            margin-bottom: .5rem;
            background: linear-gradient(90deg, #1a1f35 25%, #222840 50%, #1a1f35 75%);
            background-size: 400px 100%;
            animation: shimmer 1.5s infinite;
        }

        /* ── Load more ───────────────────────────── */
        #load-more-wrap {
            text-align: center;
            padding: 2rem 0;
        }

        #load-more-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: .75rem 2rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: .9rem;
            transition: all .2s;
        }

        #load-more-btn:hover {
            border-color: var(--border-hi);
        }

        #load-more-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        /* ── Video Detail Panel ──────────────────── */
        #vd-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, .88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            align-items: center;
            justify-content: center;
            padding: .75rem;
        }

        #vd-overlay.open {
            display: flex;
        }

        #vd-panel {
            position: relative;
            width: 100%;
            max-width: 920px;
            max-height: 94vh;
            background: linear-gradient(145deg, #0f1428, #0a0e1a);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(0, 0, 0, .7), 0 0 0 1px rgba(99, 102, 241, .1);
            animation: vd-in .28s cubic-bezier(.16, 1, .3, 1);
        }

        @keyframes vd-in {
            from {
                opacity: 0;
                transform: scale(.94) translateY(16px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        @media (min-width: 640px) {
            #vd-panel {
                flex-direction: row;
            }
        }

        #vd-left {
            flex-shrink: 0;
            position: relative;
            width: 100%;
            min-height: 240px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        @media (min-width: 640px) {
            #vd-left {
                width: 260px;
                min-height: 0;
            }
        }

        #vd-thumb-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: blur(18px) brightness(.35);
            transform: scale(1.12);
        }

        #vd-thumb {
            position: relative;
            z-index: 1;
            max-width: 100%;
            max-height: 420px;
            object-fit: contain;
        }

        #vd-play-btn {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity .2s;
            cursor: pointer;
        }

        #vd-left:hover #vd-play-btn,
        #vd-left:focus-within #vd-play-btn {
            opacity: 1;
        }

        #vd-play-icon {
            width: 56px;
            height: 56px;
            background: rgba(99, 102, 241, .9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(99, 102, 241, .5);
            transform: scale(.9);
            transition: transform .2s;
        }

        #vd-left:hover #vd-play-icon {
            transform: scale(1);
        }

        #vd-right {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 1.25rem;
        }

        #vd-right::-webkit-scrollbar {
            width: 4px;
        }

        #vd-right::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, .12);
            border-radius: 2px;
        }

        #vd-close {
            position: absolute;
            top: .7rem;
            right: .7rem;
            z-index: 20;
            width: 30px;
            height: 30px;
            background: rgba(0, 0, 0, .55);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 50%;
            color: #fff;
            font-size: .9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s;
        }

        #vd-close:hover {
            background: rgba(255, 255, 255, .1);
        }

        .vd-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 15;
            width: 34px;
            height: 34px;
            background: rgba(0, 0, 0, .55);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 50%;
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .15s;
            user-select: none;
            line-height: 1;
        }

        .vd-nav:hover {
            background: rgba(99, 102, 241, .5);
            border-color: rgba(99, 102, 241, .4);
        }

        #vd-prev {
            left: .6rem;
        }

        #vd-next {
            right: .6rem;
        }

        @media (min-width: 640px) {
            #vd-prev {
                left: -17px;
            }
            #vd-next {
                right: -17px;
            }
        }

        .vd-counter {
            font-size: .7rem;
            color: var(--muted);
            text-align: center;
            font-family: monospace;
        }

        .vd-meta-row {
            display: flex;
            gap: .75rem;
            flex-wrap: wrap;
            font-size: .75rem;
            color: var(--muted);
        }

        .vd-meta-item {
            display: flex;
            align-items: center;
            gap: .3rem;
        }

        .vd-stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: .5rem;
        }

        .vd-stat-box {
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(255, 255, 255, .07);
            border-radius: 10px;
            padding: .65rem;
            display: flex;
            flex-direction: column;
            gap: .2rem;
        }

        .vd-stat-label {
            font-size: .6rem;
            text-transform: uppercase;

        }

        .vd-stat-val {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            font-family: monospace;
        }

        .vd-section-title {
            font-size: .62rem;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--muted);
            margin-bottom: .4rem;
        }

        .vd-desc {
            font-size: .85rem;
            color: rgba(255, 255, 255, .85);
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .vd-tags {
            display: flex;
            flex-wrap: wrap;
            gap: .3rem;
            margin-top: .5rem;
        }

        .vd-tag {
            font-size: .68rem;
            color: var(--accent2);
            background: rgba(99, 102, 241, .1);
            border: 1px solid rgba(99, 102, 241, .2);
            padding: .15rem .55rem;
            border-radius: 999px;
        }

        .vd-actions {
            display: flex;
            gap: .5rem;
            margin-top: auto;
            padding-top: .5rem;
        }

        .vd-btn {
            flex: 1;
            padding: .6rem .5rem;
            border-radius: 10px;
            font-size: .8rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all .15s;
            text-align: center;
        }

        .vd-btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .vd-btn-primary:hover {
            background: var(--accent2);
        }

        .vd-btn-ghost {
            background: rgba(255, 255, 255, .05);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .vd-btn-ghost:hover {
            background: rgba(255, 255, 255, .1);
            border-color: var(--border-hi);
        }

        /* ── Toast ────────────────────────────────── */
        #toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: #1e2235;
            border: 1px solid var(--border-hi);
            color: var(--text);
            padding: .75rem 1.25rem;
            border-radius: 10px;
            font-size: .875rem;
            box-shadow: var(--shadow);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity .2s, transform .2s;
            pointer-events: none;
            z-index: 9998;
            max-width: 300px;
        }

        #toast.show {
            opacity: 1;
            transform: none;
        }

        /* ── Mobile: dashboard topbar ─────────────── */
        @media (max-width: 600px) {
            #topbar {
                gap: .5rem;
            }

            #topbar .brand {
                font-size: 1rem;
            }

            .mini-search-wrap {
                min-width: 0;
                flex: 1 1 100%;
                order: 2;
            }

            #topbar .btn {
                order: 3;
                flex: 1;
                justify-content: center;

            }

            #back-btn {
                order: 4;
                flex: 1;
            }

            #topbar .brand {
                order: 1;
            }
        }

        /* ── Mobile: compact card body ────────────── */
        @media (max-width: 760px) {
            .card-body {
                padding: .45rem .4rem;
            }

            .card-desc {
                font-size: .7rem;
                -webkit-line-clamp: 2;
            }

            .card-stats {
                gap: .35rem;
                margin-bottom: .4rem;
            }

            .card-stat {
                font-size: .6rem;
            }

            .card-date {
                font-size: .58rem;
                margin-bottom: .4rem;
            }

            .card-actions {
                gap: .3rem;
            }

            .card-btn {
                padding: .28rem .3rem;
                font-size: .58rem;
            }

            .card-tags {
                gap: .2rem;
                margin-bottom: .35rem;
            }

            .tag {
                font-size: .58rem;
                padding: .08rem .3rem;
            }

            #dashboard {
                padding: .75rem .6rem;
            }

            #controls {
                gap: .5rem;
            }

            #filter-input,
            #sort-select {
                font-size: .8rem;
                padding: .45rem .7rem;
            }
        }

        /* ── Utility ───────────────────────────────── */
        .hidden {
            display: none !important;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, .3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- ═══════════════ HERO ═══════════════ -->
    <div id="hero">
        <div class="badge">✦ Professional Analytics Engine</div>
        <h1>TikTok <span>Explorer</span></h1>
        <p>Enter a username or profile URL to deep-dive into video metrics, engagement, and metadata instantly.</p>

        <div style="position:relative; width:100%; max-width:700px;">
            <form id="search-form" onsubmit="return doSearch()">
                <input id="search-input" type="text" placeholder="Username or tiktok.com/@username..."
                       autocomplete="off" autocorrect="off" spellcheck="false">
                <input id="count-select" type="number" min="1" max="500" value="50"
                       placeholder="50" list="count-presets" title="Number of videos (1–500)">
                <datalist id="count-presets">
                    <option value="10">
                    <option value="20">
                    <option value="30">
                    <option value="50">
                    <option value="100">
                    <option value="200">
                    <option value="500">
                </datalist>
                <button type="submit" id="search-btn">
                    <span id="btn-text">Analyze</span>
                    <span>↵</span>
                </button>
            </form>
            <div id="history-dropdown" class="search-history-dropdown hidden"></div>
        </div>

        <div id="hero-error" class="error-banner hidden"></div>
    </div>

    <!-- ═══════════════ DASHBOARD ═══════════════ -->
    <div id="dashboard">
        <!-- Top bar -->
        <div id="topbar">
            <div class="brand">TikTok <span>Explorer</span></div>
            <div class="mini-search-wrap">
                <input id="mini-search" type="text" placeholder="Search another username…"
                       onkeydown="if(event.key==='Enter')doMiniSearch()">
                <div id="mini-history-dropdown" class="search-history-dropdown hidden"></div>
            </div>
            <button class="btn btn-ghost" onclick="doMiniSearch()">Analyze</button>
            <button id="back-btn" onclick="showHero()">← Back</button>
        </div>

        <!-- Profile -->
        <div id="profile-header" class="glass"></div>

        <!-- Controls -->
        <div id="controls">
            <input id="filter-input" type="text" placeholder="🔍 Filter by keyword or #hashtag…"
                   oninput="applyFilters()">
            <select id="sort-select" onchange="applyFilters()">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="views">Most views</option>
                <option value="likes">Most likes</option>
                <option value="comments">Most comments</option>
            </select>
            <label style="display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--muted);cursor:pointer">
                <input type="checkbox" id="select-all-chk" onchange="toggleSelectAll()">
                Select all
            </label>
            <button class="btn btn-ghost" onclick="selectAllSubmitted()">Select Submitted</button>
            <span class="count-badge" id="count-label"></span>
        </div>

        <!-- Bulk actions -->
        <div id="bulk-bar">
            <span id="bulk-count"></span>
            <button class="btn btn-ghost" onclick="openSelected()">Open in tabs</button>
            <button class="btn btn-accent" onclick="copySelectedLinks()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:-.15em;margin-right:5px"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy Links
            </button>
            <button class="btn btn-ghost" onclick="markSelectedAsSubmitted()">Mark as Submitted</button>
            <button class="btn btn-ghost" onclick="unmarkSelectedSubmitted()">Unmark Submitted</button>
            <button class="btn btn-green" onclick="exportData('csv')">Export CSV</button>
            <button class="btn btn-green" onclick="exportData('json')">Export JSON</button>
            <button class="btn btn-ghost" onclick="clearSelection()" style="margin-left:auto">Clear</button>
        </div>

        <!-- Selected statistics panel -->
        <div id="selected-stats" class="glass">
            <div class="stats-summary" id="stats-summary"></div>
            <button class="stats-expand-btn" id="stats-expand-btn" onclick="toggleStatsMore()">More ▼</button>
            <div id="stats-extra"></div>
        </div>

        <!-- Grid -->
        <div id="video-grid"></div>

        <!-- Load more -->
        <div id="load-more-wrap" class="hidden">
            <button id="load-more-btn" onclick="loadMore()">Load more videos</button>
        </div>

        <!-- Dashboard error -->
        <div id="dash-error" class="error-banner hidden"></div>
    </div>

    <!-- ═══════════════ VIDEO DETAIL PANEL ═══════════════ -->
    <div id="vd-overlay" onclick="closeVideoDetail()">
        <div id="vd-panel" onclick="event.stopPropagation()">
            <button id="vd-close" onclick="closeVideoDetail()" title="Close (Esc)">✕</button>
            <button class="vd-nav" id="vd-prev" onclick="navVideo(-1)" title="Previous">‹</button>
            <button class="vd-nav" id="vd-next" onclick="navVideo(1)"  title="Next">›</button>

            <div id="vd-left">
                <div id="vd-thumb-bg"></div>
                <img id="vd-thumb" src="" alt="Thumbnail">
                <div id="vd-play-btn">
                    <div id="vd-play-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </div>
                </div>
            </div>

            <div id="vd-right">
                <div id="vd-counter" class="vd-counter"></div>
                <div id="vd-meta"></div>
                <div id="vd-stats"></div>
                <div id="vd-desc-wrap"></div>
                <div id="vd-actions" class="vd-actions"></div>
            </div>
        </div>
    </div>

    <!-- ═══════════════ TOAST ═══════════════ -->
    <div id="toast"></div>

    <!-- ═══════════════ SCRIPTS ═══════════════ -->
    <script>
        // ──────────────────────────────────────────────
        //  STATE
        // ──────────────────────────────────────────────
        let allVideos      = [];
        let filtered       = [];
        let selected       = new Set();
        let currentUser    = '';
        let currentCount   = 50;
        let nextCursor     = null;
        let hasMore        = false;
        let loading        = false;
        let detailIndex    = -1;
        let statsMoreOpen  = false;
        let submitted      = new Set();   // persisted in localStorage

        // ── API key rotation ────────────────────────

        // ──────────────────────────────────────────────
        //  PERSISTENT SUBMITTED STATUS
        // ──────────────────────────────────────────────
        function loadSubmitted() {
            try {
                const raw = localStorage.getItem('tiktok_explorer_submitted');
                submitted = raw ? new Set(JSON.parse(raw)) : new Set();
            } catch (e) {
                submitted = new Set();
            }
        }
        function saveSubmitted() {
            localStorage.setItem('tiktok_explorer_submitted', JSON.stringify([...submitted]));
        }
        loadSubmitted();

        function markSelectedAsSubmitted() {
            if (selected.size === 0) { toast('Nothing selected'); return; }
            selected.forEach(id => submitted.add(id));
            saveSubmitted();
            renderGrid();
            updateBulkBar();
            updateSelectedStats();
            updateSelectAllCheckbox();
            toast(`Marked ${selected.size} as submitted`);
        }

        function unmarkSelectedSubmitted() {
            if (selected.size === 0) { toast('Nothing selected'); return; }
            selected.forEach(id => submitted.delete(id));
            saveSubmitted();
            renderGrid();
            updateBulkBar();
            updateSelectedStats();
            updateSelectAllCheckbox();
            toast(`Unmarked ${selected.size} as submitted`);
        }

        function selectAllSubmitted() {
            const submittedVids = filtered.filter(v => submitted.has(v.id));
            if (submittedVids.length === 0) {
                toast('No submitted videos found');
                return;
            }
            // Clear current selection and add all submitted
            selected = new Set(submittedVids.map(v => v.id));
            renderGrid();
            updateBulkBar();
            updateSelectedStats();
            updateSelectAllCheckbox();
            toast(`Selected ${submittedVids.length} submitted videos`);
        }

        // ──────────────────────────────────────────────
        //  UTILITY HELPERS
        // ──────────────────────────────────────────────
        const $ = id => document.getElementById(id);

        function fmt(n) {
            if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
            return String(n);
        }

        function fmtDate(ts) {
            if (!ts) return '';
            return new Date(ts * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function fmtDur(s) {
            if (!s) return '';
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return m + ':' + String(sec).padStart(2, '0');
        }

        function toast(msg, ms = 2500) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), ms);
        }

        function copyText(txt) {
            navigator.clipboard.writeText(txt).then(() => toast('Copied!')).catch(() => toast('Copy failed'));
        }

        function showHero() {
            $('dashboard').style.display = 'none';
            $('hero').style.display = 'flex';
        }

        // ──────────────────────────────────────────────
        //  SEARCH HISTORY (localStorage)
        // ──────────────────────────────────────────────
        const HISTORY_KEY = 'tiktok_explorer_history';
        const MAX_HISTORY = 25;

        function getHistory() {
            try {
                const raw = localStorage.getItem(HISTORY_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function saveHistory(arr) {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(arr));
        }

        function addToHistory(username) {
            let hist = getHistory();
            hist = hist.filter(u => u.toLowerCase() !== username.toLowerCase());
            hist.unshift(username);
            if (hist.length > MAX_HISTORY) hist = hist.slice(0, MAX_HISTORY);
            saveHistory(hist);
        }

        function removeHistoryItem(username) {
            let hist = getHistory().filter(u => u !== username);
            saveHistory(hist);
            renderHistoryDropdowns();
        }

        function clearAllHistory() {
            saveHistory([]);
            renderHistoryDropdowns();
            closeAllHistoryDropdowns();
        }

        function renderDropdown(container, hist, inputId) {
            if (!container) return;
            if (!hist.length) {
                container.innerHTML = '';
                container.classList.add('hidden');
                return;
            }
            const filterText = ($(inputId)?.value || '').trim().toLowerCase();
            let items = hist;
            if (filterText) {
                items = hist.filter(u => u.toLowerCase().includes(filterText));
            }
            if (!items.length) {
                container.innerHTML = '';
                container.classList.add('hidden');
                return;
            }
            let html = items.map(u => `
                <div class="history-item" data-username="${esc(u)}">
                    <span class="history-item-username" onclick="useHistoryItem('${esc(u)}','${inputId}')">${esc(u)}</span>
                    <button class="history-item-delete" onclick="event.stopPropagation();removeHistoryItem('${esc(u)}')" title="Remove">×</button>
                </div>
            `).join('');
            html += `<div class="history-clear" onclick="clearAllHistory()">Clear History</div>`;
            container.innerHTML = html;
            container.classList.remove('hidden');
        }

        function renderHistoryDropdowns() {
            const hist = getHistory();
            renderDropdown($('history-dropdown'), hist, 'search-input');
            renderDropdown($('mini-history-dropdown'), hist, 'mini-search');
        }

        function useHistoryItem(username, inputId) {
            $(inputId).value = username;
            if (inputId === 'mini-search') {
                doMiniSearch();
            } else {
                doSearch();
            }
            closeAllHistoryDropdowns();
        }

        function closeAllHistoryDropdowns() {
            document.querySelectorAll('.search-history-dropdown').forEach(d => d.classList.add('hidden'));
        }

        // ──────────────────────────────────────────────
        //  SEARCH FUNCTIONS
        // ──────────────────────────────────────────────
        function doSearch() {
            const val = $('search-input').value.trim();
            if (!val) return false;
            currentCount = parseInt($('count-select').value);
            startSearch(val);
            closeAllHistoryDropdowns();
            return false;
        }

        function doMiniSearch() {
            const val = $('mini-search').value.trim();
            if (!val) return;
            currentCount = 30;
            startSearch(val);
            closeAllHistoryDropdowns();
        }

        async function startSearch(rawUsername) {
            // Extract username from URL if needed
            let username = rawUsername.trim();
            const m = username.match(/tiktok\.com\/@([^\/\?#\s]+)/i);
            if (m) username = m[1];
            username = username.replace(/^@/, '');
            if (!username) return;

            addToHistory(username);
            renderHistoryDropdowns();

            currentUser  = username;
            allVideos    = [];
            selected.clear();
            nextCursor   = null;
            hasMore      = false;
            statsMoreOpen = false;
            updateSelectedStats();

            // Switch to dashboard view with skeletons
            $('hero').style.display = 'none';
            $('dashboard').style.display = 'block';
            $('profile-header').innerHTML = '';
            $('dash-error').classList.add('hidden');
            $('hero-error').classList.add('hidden');
            $('load-more-wrap').classList.add('hidden');
            $('mini-search').value = username;
            renderSkeletons(12);
            updateBulkBar();
            updateSelectAllCheckbox();

            // Fetch profile + first page of videos in parallel
            const [profResult, vidsResult] = await Promise.all([
                apiFetch('profile', { username }),
                apiFetch('videos',  { username, count: currentCount, cursor: 0 })
            ]);

            if (profResult.error) {
                showDashError(profResult.error);
                $('video-grid').innerHTML = '';
                updateSelectedStats();
                updateSelectAllCheckbox();
                return;
            }

            renderProfile(profResult);

            if (vidsResult.error) {
                showDashError(vidsResult.error);
                $('video-grid').innerHTML = '';
                updateSelectedStats();
                updateSelectAllCheckbox();
                return;
            }

            allVideos  = vidsResult.videos || [];
            nextCursor = vidsResult.cursor;
            hasMore    = vidsResult.hasMore;

            applyFilters();
            updateSelectedStats();

            if (hasMore && nextCursor) {
                $('load-more-wrap').classList.remove('hidden');
            }
        }

        async function loadMore() {
            if (loading || !hasMore || !nextCursor) return;
            loading = true;
            $('load-more-btn').disabled = true;
            $('load-more-btn').textContent = 'Loading…';

            const result = await apiFetch('videos', {
                username: currentUser,
                count: currentCount,
                cursor: nextCursor
            });

            loading = false;
            $('load-more-btn').disabled = false;
            $('load-more-btn').textContent = 'Load more videos';

            if (result.error) {
                toast('Error: ' + result.error);
                return;
            }

            allVideos  = allVideos.concat(result.videos || []);
            nextCursor = result.cursor;
            hasMore    = result.hasMore;
            applyFilters();
            updateSelectedStats();

            if (!hasMore || !nextCursor) $('load-more-wrap').classList.add('hidden');
        }

        // ──────────────────────────────────────────────
        //  API CLIENT
        // ──────────────────────────────────────────────
        function extractUsername(input) {
            input = input.trim();
            const m = input.match(/tiktok\.com\/@([^\/\?#\s]+)/i);
            return m ? m[1] : input.replace(/^@/, '');
        }

        async function rapidGet(path, params) {
            const qs = new URLSearchParams(params || {}).toString();
            const url = '/api/explorer' + path + (qs ? '?' + qs : '');
            try {
                const r = await fetch(url, {
                    headers: { 'Accept': 'application/json' }
                });
                let data;
                try { data = await r.json(); }
                catch (e) { return { error: 'Bad JSON from server (status ' + r.status + ')' }; }
                if (!r.ok) return data && data.error ? data : { error: 'API error ' + r.status };
                return data;
            } catch (e) {
                return { error: 'Network error: ' + e.message };
            }
        }

        function normalizeProfile(data, username) {
            if (data.error) return data;
            if ((data.code ?? 0) === -1 || data.msg === 'error') return { error: 'Profile not found or private account' };
            const inner  = data.data        || data.userInfo || {};
            const user   = inner.user       || data.user     || {};
            const stats  = inner.stats      || data.stats    || {};
            if (!user || !Object.keys(user).length) return { error: 'Profile not found' };
            return {
                id:         String(user.id || user.uid || ''),
                uniqueId:   user.uniqueId  || username,
                nickname:   user.nickname  || username,
                avatarUrl:  user.avatarLarger || user.avatarMedium || user.avatarThumb || '',
                bio:        user.signature || '',
                verified:   !!user.verified,
                followers:  parseInt(stats.followerCount  || 0, 10),
                following:  parseInt(stats.followingCount || 0, 10),
                likes:      parseInt(stats.heartCount || stats.heart || 0, 10),
                videoCount: parseInt(stats.videoCount || 0, 10),
                profileUrl: 'https://www.tiktok.com/@' + (user.uniqueId || username),
            };
        }

        function normalizeVideos(data, username) {
            if (data.error) return data;
            if ((data.code ?? 0) === -1) return { error: 'Profile not found or private account' };
            const inner     = data.data || data;
            const rawVideos = inner.videos || inner.aweme_list || data.videos || [];
            if (!Array.isArray(rawVideos)) return { error: 'Unexpected API response shape' };

            const videos = rawVideos.map(v => {
                let desc = '';
                if (v.title)           desc = v.title;
                else if (v.content_desc) desc = Array.isArray(v.content_desc) ? v.content_desc.join(' ') : v.content_desc;
                else if (v.desc)       desc = v.desc;

                const vm    = (v.video && typeof v.video === 'object') ? v.video : {};
                const thumb = v.cover || v.origin_cover || v.ai_dynamic_cover || vm.cover || vm.originCover || '';

                const st    = (v.stats && typeof v.stats === 'object') ? v.stats : {};
                const views    = parseInt(v.play_count    ?? st.playCount    ?? 0, 10);
                const likes    = parseInt(v.digg_count    ?? st.diggCount    ?? 0, 10);
                const comments = parseInt(v.comment_count ?? st.commentCount ?? 0, 10);
                const shares   = parseInt(v.share_count   ?? st.shareCount   ?? 0, 10);

                const hashtags = [];
                const tagMatches = desc.match(/#([\w\u00C0-\u024F]+)/gu) || [];
                tagMatches.forEach(t => hashtags.push(t.slice(1)));

                const vid       = String(v.aweme_id || v.video_id || v.id || '');
                const numericId = String(v.video_id || v.id || '');
                const shareUrl  = (v.share_url && typeof v.share_url === 'string') ? v.share_url.trim() : '';
                let videoUrl;
                if (shareUrl)                           videoUrl = shareUrl;
                else if (/^\d+$/.test(numericId))       videoUrl = 'https://www.tiktok.com/@' + username + '/video/' + numericId;
                else if (/^\d+$/.test(vid))             videoUrl = 'https://www.tiktok.com/@' + username + '/video/' + vid;
                else                                    videoUrl = 'https://www.tiktok.com/@' + username;

                return {
                    id: vid,
                    description: desc,
                    thumbnailUrl: thumb,
                    videoUrl,
                    views,
                    likes,
                    comments,
                    shares,
                    duration:   parseInt(v.duration ?? vm.duration ?? 0, 10),
                    uploadDate: parseInt(v.create_time ?? v.createTime ?? 0, 10),
                    hashtags,
                };
            });

            return {
                videos,
                cursor:  inner.cursor != null ? String(inner.cursor) : null,
                hasMore: !!(inner.hasMore ?? data.has_more ?? false),
                total:   videos.length,
            };
        }

        async function apiFetch(action, params) {
            const user = extractUsername(params.username || '');
            if (action === 'profile') {
                const raw = await rapidGet('/user/info', { unique_id: user });
                return normalizeProfile(raw, user);
            }
            if (action === 'videos') {
                const raw = await rapidGet('/user/posts', {
                    unique_id: user,
                    count:     params.count  || 30,
                    cursor:    params.cursor || 0,
                });
                return normalizeVideos(raw, user);
            }
            return { error: 'Unknown action' };
        }

        //  PROFILE RENDER

        // ──────────────────────────────────────────────
        //  FILTER & SORT
        // ──────────────────────────────────────────────
        function applyFilters() {
            const term = $('filter-input').value.trim().toLowerCase();
            const sort = $('sort-select').value;

            filtered = allVideos.filter(v => {
                if (!term) return true;
                const hay = (v.description + ' ' + (v.hashtags || []).join(' ')).toLowerCase();
                return hay.includes(term);
            });

            filtered.sort((a, b) => {
                if (sort === 'newest')   return b.uploadDate - a.uploadDate;
                if (sort === 'oldest')   return a.uploadDate - b.uploadDate;
                if (sort === 'views')    return b.views    - a.views;
                if (sort === 'likes')    return b.likes    - a.likes;
                if (sort === 'comments') return b.comments - a.comments;
                return 0;
            });

            $('count-label').textContent = `${filtered.length} video${filtered.length !== 1 ? 's' : ''}`;
            renderGrid();
            updateSelectedStats();
            updateSelectAllCheckbox();
        }

        // ──────────────────────────────────────────────
        //  VIDEO GRID RENDER
        // ──────────────────────────────────────────────
        function renderGrid() {
            const grid = $('video-grid');
            if (!filtered.length) {
                grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--muted)">No videos found</div>`;
                return;
            }
            grid.innerHTML = filtered.map((v, idx) => videoCardHTML(v, idx)).join('');
        }

                    ${dur ? `<span class="duration-badge">${dur}</span>` : ''}

                        <span class="card-stat"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>${fmt(v.views)}</span>

                        <span class="card-stat"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>${fmt(v.comments)}</span>
                        <span class="card-stat"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>${fmt(v.shares)}</span>
                    </div>
                    ${date ? `<div class="card-date">${date}</div>` : ''}
